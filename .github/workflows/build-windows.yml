name: Build OFFICINA LA PRIMA Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager" --add-data "assets;assets" app_v6.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager.exe release\LA_PRIMA_Garage_Manager.exe
          @"
          OFFICINA LA PRIMA - Garage Manager V6.1
          FIX GRAFICO DEDICATO:
          - eliminato completamente il fallback base64 difettoso
          - logo caricato direttamente dagli asset inclusi nell'EXE
          - logo LA PRIMA visibile in alto a sinistra nella sidebar
          - logo LA PRIMA grande e ben visibile come background della Home
          - pannelli semitrasparenti sopra il logo
          - tutte le funzioni V5 mantenute invariate
          Avvia LA_PRIMA_Garage_Manager.exe.
          Database, PDF e backup vengono salvati in Documenti\LA_PRIMA_Garage_Manager.
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_V6_1
          path: release/*
          retention-days: 30
