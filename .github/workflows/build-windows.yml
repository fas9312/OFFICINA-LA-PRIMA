name: Build OFFICINA LA PRIMA Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create bundled graphics
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          $bg = ''
          $logo = ''
          [IO.File]::WriteAllBytes('assets\la_prima_bg.jpg',[Convert]::FromBase64String($bg))
          [IO.File]::WriteAllBytes('assets\la_prima_logo.png',[Convert]::FromBase64String($logo))

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager" --add-data "assets;assets" app.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager.exe release\LA_PRIMA_Garage_Manager.exe
          @"
          OFFICINA LA PRIMA - Garage Manager V1
          Avvia LA_PRIMA_Garage_Manager.exe.
          Database, PDF e backup vengono salvati in Documenti\LA_PRIMA_Garage_Manager.
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_V1
          path: release/*
          retention-days: 30
