name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Compile Qt logo resource
        shell: powershell
        run: pyside6-rcc v0_1\resources.qrc -o v0_1\resources_rc.py

      - name: Verify embedded logo
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\verify_logo.py

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\db_selector.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py v0_1\main_011.py v0_1\main_013.py v0_1\main_013_entry.py v0_1\main_014.py v0_1\main_015.py v0_1\fatturapa.py v0_1\main_016.py v0_1\fatturapa_017.py v0_1\main_017.py v0_1\main_017_entry.py v0_1\main_018.py v0_1\main_018_entry.py v0_1\main_019.py v0_1\main_019_entry.py v0_1\main_020.py v0_1\main_020_entry.py v0_1\main_021.py v0_1\main_021_entry.py v0_1\main_021r.py v0_1\main_021r_entry.py v0_1\smoke_019.py v0_1\smoke_020.py v0_1\smoke_021.py v0_1\smoke_021r.py v0_1\resources_rc.py

      - name: Persona fisica FatturaPA smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_019.py

      - name: Final features smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_020.py

      - name: Password recovery smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_021.py

      - name: Responsive layout smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_021r.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1_11_RESPONSIVE" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main_021r_entry.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1_11_RESPONSIVE.exe release\LA_PRIMA_Garage_Manager_0_1_11_RESPONSIVE.exe
          Copy-Item smoke_fatturapa_pf_019.xml release\ESEMPIO_FATTURAPA_PERSONA_FISICA.xml
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1.11-R

          FIX RESPONSIVE PER NOTEBOOK, SCHERMI PICCOLI E SCALING WINDOWS
          - finestra principale dimensionata in base allo spazio realmente disponibile sul monitor
          - eliminato il minimo fisso 1180x760 che poteva far uscire la finestra dallo schermo
          - sidebar adattiva: larghezza, logo, pulsanti e caratteri cambiano in base allo spazio disponibile
          - menu laterale scorrevole verticalmente: nessuna voce viene persa sui portatili
          - toolbar delle sezioni a tabella su piu righe quando lo spazio orizzontale non basta
          - tabelle con molte colonne passano a scorrimento orizzontale sui display compatti, evitando testi sovrapposti
          - finestre di dialogo grandi (fatture, preventivi, ecc.) vengono automaticamente contenute nell'area utile dello schermo
          - gestione DPI frazionaria Windows migliorata per 100%, 125%, 150% e scale intermedie
          - layout desktop 27 pollici mantenuto ampio quando lo spazio lo consente

          RESTA PRESENTE TUTTO IL RESTO DELLA 0.1.11
          - recupero password offline
          - fatture con pagamento Contanti / Carta-POS / Bonifico
          - preventivi con IVA per singola riga
          - Dati Azienda e regime fiscale
          - FatturaPA / SDI, inclusa Persona fisica senza obbligo di P.IVA
          - login multiutente
          - database offline selezionabile anche da USB
          - logo e sfondo personalizzabile
          - calendario, tagliandi, PDF, magazzino, fornitori, backup e report

          NOTA
          Questa e una revisione responsive della 0.1.11. La successiva evoluzione funzionale del Magazzino e dei riepiloghi economici resta separata, cosi il fix grafico puo essere verificato subito anche sul portatile.
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1_11_RESPONSIVE
          path: release/*
          retention-days: 30
