name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Compile Qt logo resource
        shell: powershell
        run: pyside6-rcc v0_1\resources.qrc -o v0_1\resources_rc.py

      - name: Verify embedded logo
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\verify_logo.py

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\db_selector.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py v0_1\main_011.py v0_1\main_013.py v0_1\main_013_entry.py v0_1\main_014.py v0_1\main_015.py v0_1\fatturapa.py v0_1\main_016.py v0_1\fatturapa_017.py v0_1\main_017.py v0_1\main_017_entry.py v0_1\smoke_017.py v0_1\resources_rc.py

      - name: Data Azienda and FatturaPA smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_017.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1_7" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main_017_entry.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1_7.exe release\LA_PRIMA_Garage_Manager_0_1_7.exe
          Copy-Item smoke_017.png release\VERIFICA_GRAFICA_0_1_7.png
          Copy-Item smoke_fatturapa_017.xml release\ESEMPIO_FATTURAPA_TEST.xml
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1.7

          NOVITA 0.1.7
          - Impostazioni > Dati Azienda: sezione unica per compilare i dati fiscali necessari alla generazione FatturaPA
          - ragione sociale, P.IVA, CF, regime fiscale, sede, CAP, comune, provincia, nazione, telefono, email e PEC
          - dati REA opzionali: ufficio, numero REA, capitale sociale, socio unico/plurimo, stato liquidazione
          - IBAN, banca, condizioni e modalita di pagamento predefinite
          - Fatture > Dati FatturaPA: tipo documento, pagamento, scadenza, IBAN, bollo virtuale e Natura IVA
          - XML FatturaPA con DatiTrasmissione, CedentePrestatore, CessionarioCommittente, DatiGeneraliDocumento, DatiBeniServizi, riepiloghi IVA e DatiPagamento
          - XML salvabile offline e predisposto per caricamento manuale nei canali Agenzia delle Entrate / SDI o consegna al commercialista
          - controllo campi obbligatori prima dell'esportazione
          - logo sidebar: rimosse le scritte separate; l'intero logo ufficiale con bandiere viene mostrato su riquadro gradiente bianco-grigio

          RESTANO PRESENTI
          - login multiutente con password facoltativa
          - selezione database offline anche da USB
          - sfondo Dashboard selezionabile
          - fatture a righe con IVA e calcoli automatici
          - XML gestionale separato
          - tagliandi programmati nel calendario
          - PDF singoli e riepilogativi
          - preventivi a voci
          - marca/modello auto da database locale

          IMPORTANTE
          Il programma genera il file XML e non lo invia automaticamente allo SDI. Prima del primo utilizzo fiscale reale, verificare con il commercialista i dati aziendali, il regime fiscale, i codici Natura e il primo file generato. L'accettazione finale resta soggetta ai controlli del Sistema di Interscambio.
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1_7
          path: release/*
          retention-days: 30
