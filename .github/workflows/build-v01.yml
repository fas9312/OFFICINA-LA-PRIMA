name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1.exe release\LA_PRIMA_Garage_Manager_0_1.exe
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1

          RISCRITTURA COMPLETA DA ZERO IN PYSIDE6/QT.
          Nessuna eredita dalle precedenti V1-V6.
          - logo ufficiale nella sidebar
          - logo ufficiale come background reale della Home
          - pannelli semitrasparenti sopra il background
          - scrollbar verticale reale
          - database SQLite separato 0.1
          - clienti, veicoli, commesse, appuntamenti, tagliandi, preventivi,
            fatture, magazzino, fornitori, scadenze, report, backup, impostazioni
          - marca/modello auto con menu a tendina
          - preventivi a voci e stampa PDF singola
          - calendario operativo con mese precedente/successivo/Oggi e click sul giorno

          Dati: Documenti\LA_PRIMA_Garage_Manager_01
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1
          path: release/*
          retention-days: 30
