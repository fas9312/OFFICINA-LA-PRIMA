name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Compile Qt logo resource
        shell: powershell
        run: pyside6-rcc v0_1\resources.qrc -o v0_1\resources_rc.py

      - name: Verify embedded logo
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\verify_logo.py

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\db_selector.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py v0_1\main_011.py v0_1\main_013.py v0_1\main_013_entry.py v0_1\main_014.py v0_1\main_015.py v0_1\fatturapa.py v0_1\main_016.py v0_1\fatturapa_017.py v0_1\main_017.py v0_1\main_017_entry.py v0_1\main_018.py v0_1\main_018_entry.py v0_1\main_019.py v0_1\main_019_entry.py v0_1\main_020.py v0_1\main_020_entry.py v0_1\main_021.py v0_1\main_021_entry.py v0_1\smoke_019.py v0_1\smoke_020.py v0_1\smoke_021.py v0_1\resources_rc.py

      - name: Persona fisica FatturaPA smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_019.py

      - name: Final features smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_020.py

      - name: Password recovery smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_021.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1_11" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main_021_entry.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1_11.exe release\LA_PRIMA_Garage_Manager_0_1_11.exe
          Copy-Item smoke_fatturapa_pf_019.xml release\ESEMPIO_FATTURAPA_PERSONA_FISICA.xml
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1.11

          RECUPERO PASSWORD OFFLINE
          - nuovo pulsante Password dimenticata? nella schermata di accesso
          - Impostazioni > Sicurezza e recupero password
          - possibilita di impostare o cambiare un codice di recupero del gestionale
          - il codice deve avere almeno 6 caratteri
          - il codice di recupero viene salvato soltanto come hash nel database, non in chiaro
          - dopo verifica del codice si puo impostare una nuova password per l'utente selezionato
          - e possibile anche lasciare la nuova password vuota, mantenendo la modalita utente senza password
          - se non esiste ancora un codice di recupero, dopo l'accesso il programma propone di configurarlo
          - la modifica o eliminazione di un utente protetto da password richiede ora la password attuale; in caso di dimenticanza si usa il recupero
          - tutto resta completamente offline, senza email e senza servizi cloud

          RESTA PRESENTE TUTTO IL RESTO DELLA 0.1.10
          - fatture con pagamento Contanti / Carta-POS / Bonifico
          - preventivi con IVA per singola riga e totali imponibile/IVA/lordo
          - tipo soggetto e regime fiscale selezionabili nei Dati Azienda
          - FatturaPA / SDI, inclusa Persona fisica senza obbligo di P.IVA
          - login multiutente
          - database offline selezionabile anche da USB
          - logo e sfondo personalizzabile
          - calendario, tagliandi, PDF, magazzino, fornitori, backup e report

          IMPORTANTE
          Conservare il codice di recupero fuori dal PC, ad esempio su carta o in un password manager. Se si dimenticano sia la password sia il codice di recupero, il programma non dispone di un servizio email/cloud capace di recuperarli.
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1_11
          path: release/*
          retention-days: 30
