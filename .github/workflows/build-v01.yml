name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Compile Qt logo resource
        shell: powershell
        run: pyside6-rcc v0_1\resources.qrc -o v0_1\resources_rc.py

      - name: Verify embedded logo
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\verify_logo.py

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\db_selector.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py v0_1\main_011.py v0_1\main_013.py v0_1\main_013_entry.py v0_1\main_014.py v0_1\smoke_014.py v0_1\resources_rc.py

      - name: UI and database selector smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_014.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1_4" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main_014.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1_4.exe release\LA_PRIMA_Garage_Manager_0_1_4.exe
          Copy-Item smoke_014.png release\VERIFICA_GRAFICA_0_1_4.png
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1.4

          NOVITA 0.1.4
          - Impostazioni > Database offline
          - pulsante Scegli database per caricare un database LA PRIMA esistente
          - supporto database nei Documenti, su disco esterno o su pennetta USB
          - il file viene usato direttamente nella posizione scelta, senza copiarlo
          - verifica integrita SQLite e controllo delle tabelle LA PRIMA prima del caricamento
          - percorso del database attivo sempre visibile nelle Impostazioni
          - pulsante Usa database predefinito per tornare a Documenti\LA_PRIMA_Garage_Manager_01\la_prima_01.db
          - possibilita di riavviare subito il programma dopo la scelta del database
          - se un database esterno non e disponibile all'avvio, il programma apre il predefinito e mostra un avviso

          RESTANO PRESENTI
          - logo sidebar leggibile
          - sfondo Dashboard selezionabile come una skin
          - fatture a righe con IVA e calcoli automatici
          - tagliandi Programmati visibili automaticamente nel calendario Home
          - scrollbar Dashboard
          - stampa PDF singola per clienti, veicoli, commesse, appuntamenti, tagliandi, preventivi, fatture e fornitori
          - stampe situazione PDF
          - marca/modello auto da database locale
          - preventivi a voci

          Database predefinito: Documenti\LA_PRIMA_Garage_Manager_01\la_prima_01.db
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1_4
          path: release/*
          retention-days: 30
