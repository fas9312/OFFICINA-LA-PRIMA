name: Build LA PRIMA 0.1 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'v0_1/**'
      - 'requirements-v01.txt'
      - '.github/workflows/build-v01.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-v01.txt

      - name: Compile Qt logo resource
        shell: powershell
        run: pyside6-rcc v0_1\resources.qrc -o v0_1\resources_rc.py

      - name: Verify embedded logo
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\verify_logo.py

      - name: Syntax check
        shell: powershell
        run: python -m py_compile v0_1\core.py v0_1\car_catalog.py v0_1\dashboard_mixin.py v0_1\clients_vehicles_mixin.py v0_1\jobs_appointments_mixin.py v0_1\services_mixin.py v0_1\quotes_mixin.py v0_1\invoices_suppliers_mixin.py v0_1\inventory_deadlines_mixin.py v0_1\misc_mixin.py v0_1\main.py v0_1\main_011.py v0_1\smoke_011.py v0_1\resources_rc.py

      - name: UI smoke test
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python v0_1\smoke_011.py

      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "LA_PRIMA_Garage_Manager_0_1_2" --add-data "v0_1/assets;assets" --paths "v0_1" v0_1/main_011.py

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\LA_PRIMA_Garage_Manager_0_1_2.exe release\LA_PRIMA_Garage_Manager_0_1_2.exe
          Copy-Item smoke_011.png release\VERIFICA_GRAFICA_0_1_2.png
          @"
          OFFICINA LA PRIMA - Garage Manager 0.1.2

          NOVITA PRINCIPALE: SFONDO SELEZIONABILE COME UNA SKIN
          - Impostazioni > Sfondo Dashboard > Scegli immagine
          - supporto PNG / JPG / JPEG / BMP / WEBP
          - l'immagine scelta viene copiata in Documenti\LA_PRIMA_Garage_Manager_01\Backgrounds
          - lo sfondo resta disponibile ai riavvii anche se il file originale viene spostato
          - cursore Intensita sfondo 15%-100%
          - pulsante Ripristina logo LA PRIMA
          - cambio sfondo applicato immediatamente

          RESTANO PRESENTI:
          - scrollbar Dashboard
          - clienti e veicoli con stampa PDF singola
          - commesse e appuntamenti con stampa PDF singola
          - tagliandi e preventivi con stampa PDF singola
          - fatture e fornitori con stampa PDF singola
          - stampe situazione PDF
          - marca/modello auto da database locale
          - preventivi a voci

          Dati: Documenti\LA_PRIMA_Garage_Manager_01
          "@ | Set-Content release\LEGGIMI.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LA_PRIMA_Garage_Manager_Windows_0_1_2
          path: release/*
          retention-days: 30
